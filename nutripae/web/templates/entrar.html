{% extends "base.html" %}
{% block title %}Entrar · NutriPAE{% endblock %}
{% block content %}
<main class="np-entrar np-manchas">
  <form method="post" action="/entrar" class="np-card np-entrar-caja">
    <h1><img src="/static/img/logo-600.png" alt="NutriPAE" width="240"></h1>
    <p class="np-entrar-saludo">¡Hola! Entra para revisar los platos.</p>
    {% if error %}<p class="np-error" role="alert"><span aria-hidden="true">✕</span> {{ error }}</p>{% endif %}
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="contrasena">Contraseña</label>
    <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
    <button type="submit" class="np-btn">Entrar</button>
  </form>
</main>
{% endblock %}
