# Tema NutriPAE · sistema de diseño v1 (Claude Design)
[theme]
base = "light"
primaryColor = "#1F7A4D"
backgroundColor = "#F6F2EA"
secondaryBackgroundColor = "#FFFDF9"
textColor = "#1D2622"
linkColor = "#1F7A4D"
borderColor = "#E3DDD1"
dataframeBorderColor = "#E3DDD1"
dataframeHeaderBackgroundColor = "#EFEAE0"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "14px"
redColor = "#B8322A"
orangeColor = "#E8A317"
yellowColor = "#E8A317"
greenColor = "#1F7A4D"
violetColor = "#7A2348"
grayColor = "#4A554F"
font = "Atkinson Hyperlegible Next:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap, system-ui, sans-serif"
codeFont = "Atkinson Hyperlegible Mono:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap, ui-monospace, monospace"
chartCategoricalColors = ["#1F7A4D", "#E8A317", "#B8322A", "#7A2348", "#8FBF9F", "#4A554F"]

[theme.sidebar]
backgroundColor = "#FFFDF9"
secondaryBackgroundColor = "#F6F2EA"
borderColor = "#E3DDD1"

# Uso real: sin botón "Deploy" ni menú de desarrollador, sin trazas técnicas en pantalla
[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
